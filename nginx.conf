# ClerkAI — единственная точка входа: SPA + шлюз /api/* к сервисам.
# Файл подключается в http-контекст официального образа nginx (/etc/nginx/conf.d/).
# Пути НЕ переписываются: каждый сервис сам обслуживает свои префиксы, включая /api
# (см. docs/API.md, раздел 2).

# Cache-Control по итоговому $uri (после try_files): ассеты Vite с хешем — навсегда,
# index.html — без кеша, остальное (в т.ч. ответы API) — заголовок не добавляется.
map $uri $clerkai_cache_control {
    ~^/assets/      "public, max-age=31536000, immutable";
    /index.html     "no-cache";
    default         "";
}

# ---------- Лимиты запросов (http-контекст: файл подключается из conf.d внутри http {}) ----------
# Ключ — IP клиента ($binary_remote_addr; за реверс-прокси это реальный IP, см. real_ip ниже).
# Пустой ключ nginx не учитывает, поэтому через map ограничиваем только нужное:
#   auth — только POST (вход, регистрация, сброс пароля), 10 запросов в минуту с IP;
#   api  — всё под /api/, 20 запросов в секунду с IP (SPA и статика не лимитируются).
map $request_method $clerkai_auth_limit_key {
    POST    $binary_remote_addr;
    default "";
}
map $uri $clerkai_api_limit_key {
    ~^/api/ $binary_remote_addr;
    default "";
}
limit_req_zone $clerkai_auth_limit_key zone=auth:10m rate=10r/m;
limit_req_zone $clerkai_api_limit_key  zone=api:10m  rate=20r/s;

# Схема исходного запроса: за TLS-терминатором (Caddy) берём X-Forwarded-Proto, иначе — свою.
map $http_x_forwarded_proto $clerkai_forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;

    # Реальный IP клиента за реверс-прокси (Caddy из docker-compose.prod.yml, балансировщик):
    # X-Forwarded-For принимается только от адресов частных сетей (сеть docker, локальный хост).
    # real_ip_recursive: берётся самый правый адрес, не входящий в доверенные, — подделать
    # его, дописав свой X-Forwarded-For, нельзя.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from ::1;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Лимит для всего /api/ (ключ пустой для прочих URI). Локации входа/регистрации/сброса
    # пароля задают свои limit_req и потому повторяют этот явно.
    limit_req zone=api burst=40;
    limit_req_status 429;
    limit_req_log_level warn;
    error_page 429 = @too_many;

    # Встроенный DNS Docker. Апстримы задаются через переменные, поэтому nginx
    # стартует, даже если какой-то сервис ещё не поднят (имя резолвится на запросе).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/manifest+json;

    # Заголовки безопасности (наследуются во все location, т.к. ниже add_header больше нет).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://securepay.tinkoff.ru" always;
    add_header Cache-Control $clerkai_cache_control;

    # Общие параметры проксирования.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $clerkai_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Ответ при превышении лимита (429) — JSON в формате ошибок API.
    location @too_many {
        default_type application/json;
        return 429 '{"detail":"Слишком много запросов, повторите позже"}';
    }

    # ---------- API ----------
    # proxy_pass с переменной и без URI-части передаёт исходный URI запроса
    # (вместе с query string) без изменений — именно это и нужно.

    location ^~ /api/internal/ {
        default_type application/json;
        return 404 '{"detail":"Not found"}';
    }

    # auth-service
    # Публичные точки входа — строгий лимит на POST (подбор паролей, массовые регистрации, спам письмами).
    location = /api/auth/login {
        limit_req zone=auth burst=5 nodelay;
        limit_req zone=api burst=40;
        set $auth_upstream http://auth-service:8001;
        proxy_pass $auth_upstream;
    }
    location = /api/auth/register {
        limit_req zone=auth burst=5 nodelay;
        limit_req zone=api burst=40;
        set $auth_upstream http://auth-service:8001;
        proxy_pass $auth_upstream;
    }
    # /api/auth/password-reset и /api/auth/password-reset/confirm
    location ^~ /api/auth/password-reset {
        limit_req zone=auth burst=5 nodelay;
        limit_req zone=api burst=40;
        set $auth_upstream http://auth-service:8001;
        proxy_pass $auth_upstream;
    }
    location ^~ /api/auth/ {
        set $auth_upstream http://auth-service:8001;
        proxy_pass $auth_upstream;
    }
    location ^~ /api/users {
        set $auth_upstream http://auth-service:8001;
        proxy_pass $auth_upstream;
    }
    location ^~ /api/company {
        set $auth_upstream http://auth-service:8001;
        proxy_pass $auth_upstream;
    }
    location ^~ /api/subscription {
        set $auth_upstream http://auth-service:8001;
        proxy_pass $auth_upstream;
    }

    # ai-service (голос до 10 МБ, генерация — долго)
    location ^~ /api/ai/ {
        client_max_body_size 11m;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        set $ai_upstream http://ai-service:8002;
        proxy_pass $ai_upstream;
    }

    # documents-service
    location ^~ /api/clients {
        set $documents_upstream http://documents-service:8003;
        proxy_pass $documents_upstream;
    }
    location ^~ /api/acts {
        set $documents_upstream http://documents-service:8003;
        proxy_pass $documents_upstream;
    }
    location ^~ /api/invoices {
        set $documents_upstream http://documents-service:8003;
        proxy_pass $documents_upstream;
    }
    location ^~ /api/reports {
        # генерация отчёта ходит в task/financial-service
        proxy_read_timeout 120s;
        set $documents_upstream http://documents-service:8003;
        proxy_pass $documents_upstream;
    }
    location ^~ /api/products {
        set $documents_upstream http://documents-service:8003;
        proxy_pass $documents_upstream;
    }
    location ^~ /api/inventory/ {
        set $documents_upstream http://documents-service:8003;
        proxy_pass $documents_upstream;
    }

    # notification-service
    location ^~ /api/notifications {
        set $notification_upstream http://notification-service:8004;
        proxy_pass $notification_upstream;
    }

    # financial-service (импорт выписок до 5 МБ)
    location ^~ /api/finance/ {
        client_max_body_size 6m;
        set $finance_upstream http://financial-service:8005;
        proxy_pass $finance_upstream;
    }
    location ^~ /api/tax/ {
        client_max_body_size 6m;
        set $finance_upstream http://financial-service:8005;
        proxy_pass $finance_upstream;
    }
    location ^~ /api/bank/ {
        client_max_body_size 6m;
        set $finance_upstream http://financial-service:8005;
        proxy_pass $finance_upstream;
    }
    location ^~ /api/contractors/ {
        client_max_body_size 6m;
        set $finance_upstream http://financial-service:8005;
        proxy_pass $finance_upstream;
    }

    # task-service (Go)
    location ^~ /api/tasks {
        set $task_upstream http://task-service:8009;
        proxy_pass $task_upstream;
    }
    location ^~ /api/time/ {
        set $task_upstream http://task-service:8009;
        proxy_pass $task_upstream;
    }
    location ^~ /api/meetings {
        set $task_upstream http://task-service:8009;
        proxy_pass $task_upstream;
    }
    location ^~ /api/important-dates {
        set $task_upstream http://task-service:8009;
        proxy_pass $task_upstream;
    }

    # Всё остальное под /api/ — не существует.
    location ^~ /api/ {
        default_type application/json;
        return 404 '{"detail":"Not found"}';
    }

    # ---------- SPA ----------
    location ^~ /assets/ {
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
