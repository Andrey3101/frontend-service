version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true  # Для работы watch в Docker
      - VUE_APP_API_GATEWAY=http://localhost:8000
      - VUE_APP_WS_GATEWAY=ws://localhost:8000
      - NODE_ENV=development
    networks:
      - frontend-network

networks:
  frontend-network:
    driver: bridge